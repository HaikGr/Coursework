<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad)"/>
  
  <!-- Database cylinder stack -->
  <g filter="url(#shadow)">
    <!-- Top cylinder -->
    <ellipse cx="100" cy="65" rx="35" ry="12" fill="url(#accentGrad)"/>
    <rect x="65" y="65" width="70" height="18" fill="#3b82f6"/>
    <ellipse cx="100" cy="83" rx="35" ry="12" fill="#2563eb"/>
    
    <!-- Middle cylinder -->
    <ellipse cx="100" cy="90" rx="35" ry="12" fill="url(#accentGrad)"/>
    <rect x="65" y="90" width="70" height="18" fill="#3b82f6"/>
    <ellipse cx="100" cy="108" rx="35" ry="12" fill="#2563eb"/>
  </g>
  
  <!-- Code brackets symbol -->
  <g fill="#fff" opacity="0.95">
    <!-- Left bracket -->
    <path d="M 50 125 L 45 125 Q 40 125 40 130 L 40 155 Q 40 160 45 160 L 50 160" 
          stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Right bracket -->
    <path d="M 150 125 L 155 125 Q 160 125 160 130 L 160 155 Q 160 160 155 160 L 150 160" 
          stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- SQL text -->
    <text x="100" y="150" font-family="Arial, sans-serif" font-size="24" 
          font-weight="bold" text-anchor="middle" fill="#fff">SQL</text>
  </g>
  
  <!-- Decorative query lines -->
  <g stroke="#93c5fd" stroke-width="2" opacity="0.6" stroke-linecap="round">
    <line x1="75" y1="70" x2="95" y2="70"/>
    <line x1="75" y1="76" x2="85" y2="76"/>
    <line x1="105" y1="95" x2="125" y2="95"/>
    <line x1="105" y1="101" x2="115" y2="101"/>
  </g>
</svg>